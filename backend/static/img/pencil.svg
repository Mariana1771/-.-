<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pencilGrad" x1="0" y1="0" x2="160" y2="160">
      <stop offset="0%" stop-color="#FCA5A5"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5"/>
    </filter>
  </defs>
  <!-- Glow background -->
  <circle cx="80" cy="80" r="75" fill="url(#pencilGrad)" opacity="0.08"/>
  <!-- Pencil -->
  <g>
    <!-- Shaft -->
    <rect x="67" y="20" width="16" height="105" rx="8" fill="#FDE047" stroke="url(#pencilGrad)" stroke-width="2" opacity="0.9"/>
    <!-- Highlight -->
    <ellipse cx="71" cy="45" rx="2.5" ry="10" fill="#fff" opacity="0.35"/>
    <!-- Metal ferrule -->
    <rect x="65" y="120" width="20" height="10" fill="#D4AF37" opacity="0.85"/>
    <!-- Eraser -->
    <rect x="65" y="130" width="20" height="14" rx="3" fill="url(#pencilGrad)" opacity="0.95" filter="url(#blur)"/>
    <!-- Graphite -->
    <polygon points="75,20 70,6 80,6" fill="#1F2937"/>
  </g>
</svg>
