<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nbGrad" x1="0" y1="0" x2="160" y2="160">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5"/>
    </filter>
  </defs>
  <!-- Glow background -->
  <circle cx="80" cy="80" r="75" fill="url(#nbGrad)" opacity="0.08"/>
  <!-- Notebook -->
  <g>
    <rect x="38" y="32" width="84" height="96" rx="10" fill="#fff" stroke="url(#nbGrad)" stroke-width="3" opacity="0.95" filter="url(#blur)"/>
    <!-- Spiral -->
    <circle cx="50" cy="48" r="2.5" fill="url(#nbGrad)"/>
    <circle cx="50" cy="66" r="2.5" fill="url(#nbGrad)"/>
    <circle cx="50" cy="84" r="2.5" fill="url(#nbGrad)"/>
    <circle cx="50" cy="102" r="2.5" fill="url(#nbGrad)"/>
    <!-- Lines -->
    <line x1="63" y1="48" x2="112" y2="48" stroke="url(#nbGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="63" y1="66" x2="112" y2="66" stroke="url(#nbGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="63" y1="84" x2="112" y2="84" stroke="url(#nbGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="63" y1="102" x2="105" y2="102" stroke="url(#nbGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>
