<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dictGrad" x1="0" y1="0" x2="160" y2="160">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5"/>
    </filter>
  </defs>
  <!-- Glow background -->
  <circle cx="80" cy="80" r="75" fill="url(#dictGrad)" opacity="0.1"/>
  <!-- Open book -->
  <g>
    <!-- Left page -->
    <path d="M 32 30 L 32 130 Q 32 134 36 134 L 75 134 L 75 30 Z" fill="#fff" stroke="url(#dictGrad)" stroke-width="2.5" opacity="0.8"/>
    <!-- Right page -->
    <path d="M 75 30 L 75 134 L 128 134 Q 132 134 132 130 L 132 30 Z" fill="#fff" stroke="url(#dictGrad)" stroke-width="2.5" opacity="0.95" filter="url(#blur)"/>
    <!-- Spine -->
    <line x1="75" y1="30" x2="75" y2="134" stroke="url(#dictGrad)" stroke-width="3" opacity="0.9"/>
    <!-- Text marks left -->
    <line x1="44" y1="50" x2="64" y2="50" stroke="url(#dictGrad)" stroke-width="1.5" opacity="0.4"/>
    <line x1="44" y1="67" x2="64" y2="67" stroke="url(#dictGrad)" stroke-width="1.5" opacity="0.35"/>
    <line x1="44" y1="84" x2="64" y2="84" stroke="url(#dictGrad)" stroke-width="1.5" opacity="0.3"/>
    <!-- Text marks right -->
    <line x1="87" y1="50" x2="120" y2="50" stroke="url(#dictGrad)" stroke-width="1.5" opacity="0.7"/>
    <line x1="87" y1="67" x2="120" y2="67" stroke="url(#dictGrad)" stroke-width="1.5" opacity="0.65"/>
    <line x1="87" y1="84" x2="120" y2="84" stroke="url(#dictGrad)" stroke-width="1.5" opacity="0.6"/>
    <line x1="87" y1="101" x2="120" y2="101" stroke="url(#dictGrad)" stroke-width="1.5" opacity="0.55"/>
  </g>
</svg>
