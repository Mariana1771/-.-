{% extends 'base.html' %}
{% block title %}Увійти — Slovak.sk{% endblock %}
{% block content %}
<div class="container-sm" style="padding-top:60px;">
  <div style="text-align:center;margin-bottom:32px;">
    <a href="{% url 'home' %}" style="font-family:'Playfair Display',serif;font-size:22px;color:var(--pink-500);text-decoration:none;">Slovak.sk</a>
    <h1 style="font-size:26px;font-weight:700;margin-top:16px;">Вітаємо назад!</h1>
    <p style="color:var(--text-2);margin-top:6px;">Увійди у свій акаунт</p>
  </div>

  <div class="card">
    {% if error %}
    <div class="alert alert-warn" style="margin-bottom:20px;">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Логін</label>
        <input type="text" name="username" class="form-input" value="{{ username|default:'' }}" autofocus placeholder="твій_логін">
      </div>
      <div class="form-group">
        <label class="form-label">Пароль</label>
        <input type="password" name="password" class="form-input" placeholder="••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;">Увійти</button>
    </form>

    <hr class="divider">
    <p style="text-align:center;font-size:14px;color:var(--text-2);">
      Немає акаунту?
      <a href="{% url 'register' %}" style="color:var(--pink-500);font-weight:600;">Зареєструватися</a>
    </p>
  </div>
</div>
{% endblock %}
