{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width: 600px; margin: 50px auto; text-align: center;">
    <div class="card" style="padding: 40px; border-radius: 24px; border: 1px solid #fce7f3; background: white; box-shadow: 0 10px 25px rgba(219, 39, 119, 0.05);">
        
      <h2 style="font-weight: 800; color: #1f2937; margin-bottom: 5px;">Результат тесту</h2>
        
        <p style="color: #9ca3af; font-size: 14px; margin-bottom: 30px; font-weight: 600;">
            Завершено: {{ attempt.taken_at|date:"d.m.Y H:i" }}
        </p>

        <div style="margin-bottom: 40px; display: flex; justify-content: center; gap: 15px;">
            <div style="background: #fff1f2; padding: 20px; border-radius: 18px; flex: 1;">
                <div style="font-size: 26px; font-weight: 800; color: #db2777;">{{ attempt.score }} / {{ attempt.total }}</div>
                <div style="font-size: 11px; color: #f43f5e; font-weight: 700; text-transform: uppercase;">Правильно</div>
            </div>
            
            <div style="background: #fdf2f8; padding: 20px; border-radius: 18px; flex: 1;">
                <div style="font-size: 26px; font-weight: 800; color: #db2777;">+{{ attempt.xp_earned }}</div>
                <div style="font-size: 11px; color: #be185d; font-weight: 700; text-transform: uppercase;">Досвід XP</div>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 12px;">
            <a href="{% url 'dashboard' %}" style="background: #db2777; color: white; padding: 16px; border-radius: 14px; text-decoration: none; font-weight: 700; box-shadow: 0 4px 12px rgba(219, 39, 119, 0.2);">
                Повернутися до навчання
            </a>
            <a href="{% url 'quiz' %}" style="color: #db2777; text-decoration: none; font-weight: 700; font-size: 14px; padding: 10px;">
                Спробувати ще раз
            </a>
        </div>
    </div>
</div>
{% endblock %}
